[[variants]]
id = "progressive_passes.fbref-opta"
name = "FBref (Opta data), historical"
definition = "Completed passes that move the ball towards the opponent's goal line at least 10 yards from its furthest point in the last six passes, or any completed pass into the penalty area. Passes from the defending 40% of the pitch do not count."
formula = "completed pass, start not in the defending 40%, and (end - furthest point of the ball in the last six passes >= 10 yards towards the goal line, or end in the penalty area)"
zone = "Passes from outside the passing team's defending 40%."
counts = "Completed passes only."
notes = [
  "FBref removed its Opta advanced data on 20 January 2026 (Sports Reference blog, 'FBref & Stathead Data Update'), so this variant is historical.",
  "FBref does not say how the 'furthest point in the last six passes' is found (which passes, and whether across possessions). The reference code states its reading.",
  "The same text defined FBref's 'Progressive Passes Received'.",
]

  [variants.source]
  kind = "web"
  id = "https://web.archive.org/web/20250503183817/https://fbref.com/en/comps/9/passing/Premier-League-Stats"
  title = "Premier League Passing Stats (archived 3 May 2025)"
  author = "FBref"
  date = "2025-05-03"
  quote = "Completed passes that move the ball towards the opponent's goal line at least 10 yards from its furthest point in the last six passes, or any completed pass into the penalty area. Excludes passes from the defending 40% of the pitch"
  check = "browser"
  checked = "2026-10-04"
  check_note = "The definition is the column tooltip (the data-tip attribute of the PrgP header), not readable page text, so match_quote cannot read it; checked word for word in the archived page in a browser."

  [variants.reference]
  function = "football_metrics.progression:progressive_passes_fbref"
  dataset = "statsbomb-open-data"
  exact = false
  mapping = "An approximation on StatsBomb events of a definition written for Opta events: completed Pass events (no pass.outcome), set pieces included, starting at x >= 48; progressive if the end is in the penalty area (x >= 102, 18 <= y <= 62) from outside it, or if end x minus the furthest x of the ball is at least 10 (StatsBomb units are yards). The furthest x is read as the largest x among the pass start and the start and end of the team's previous six completed passes in the same StatsBomb possession."

