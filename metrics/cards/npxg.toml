[[variants]]
id = "npxg.fbref"
name = "FBref (Opta values, penalty rebounds removed), historical to January 2026"
definition = "FBref's possession-capped xG (xg.fbref) without penalty kicks and without shots from a rebound after a penalty kick: FBref treats such a rebound as part of the penalty kick xG. In FBref's example a Reus penalty (.79) and his rebound (.92) give .9832 xG and 0 npxG."
formula = "xg.fbref total, leaving out penalty kicks and shots from a rebound after a penalty kick"
zone = "Whole pitch (every non-penalty shot)."
notes = [
  "FBref's tooltip names the column 'Non-Penalty Expected Goals' (npxG) and says 'Provided by Opta.'",
  "Historical: FBref removed its Opta advanced data, xG and npxG included, on 20 January 2026 (Sports Reference blog, 'FBref & Stathead Data Update'). Values cited from FBref before then follow this variant.",
  "No reference code: the values come from Opta's model, which is not in the open data.",
]

  [variants.source]
  kind = "web"
  id = "https://web.archive.org/web/20260107000728/https://fbref.com/en/expected-goals-model-explained/"
  title = "xG Explained"
  author = "FBref (Sports Reference)"
  quote = "However, since the second shot is also considered to be a part of the penalty kick xG, Reus gets 0 npxG (non-penalty expected goals) on this play."
  check = "exact"
  checked = "2026-10-04"
  check_note = "FBref blocks automated clients, so the quote is checked against a Wayback Machine snapshot of 7 January 2026."

[[variants]]
id = "npxg.understat"
name = "Understat (NPxG)"
definition = "Understat's xG without penalties. Its team column NPxG is expected goals for, without penalties and own goals; its player column NPxG is xG without penalties."
formula = "sum of Understat shot xG over shots whose situation is not Penalty"
zone = "Whole pitch (every non-penalty shot)."
notes = [
  "Checked on Understat's public data (4 October 2026): in Liverpool v Manchester City, 8 February 2026 (Understat match 29024), Manchester City's npxG of 1.65359 is its xG of 2.41476 minus its one penalty (0.7612).",
  "Understat does not say how it treats a rebound after a penalty, or how own goals enter its xG.",
  "NPxGA and NPxGD are the same measure for shots conceded and the difference.",
  "No reference code: the values come from Understat's model, which is not in the open data.",
]

  [variants.source]
  kind = "web"
  id = "https://understat.com/js/league.min.js"
  title = "Understat league page script (column tooltips)"
  author = "Understat"
  quote = "Expected goals for without penalties and own goals"
  check = "exact"
  checked = "2026-10-04"
  check_note = "The tooltip text is in the page's script, not its HTML."
