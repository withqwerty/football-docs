[[variants]]
id = "xg.statsbomb-cumulative"
name = "Hudl StatsBomb cumulative xG (one possession is worth at most one goal)"
definition = "Within each possession, the team's shots count as 1 minus the product of each shot's probability of not scoring, so a shot and its rebound cannot add up to more than one goal. The possession values are then added up. Hudl calls this cumulative xG and shows it in IQ, the IQ API and the match race chart."
formula = "sum over possessions of [1 - product over the possession's shots of (1 - shot_xg)]"
zone = "Whole pitch (every shot)."
notes = [
  "Hudl's example: two shots of 0.8 xG in one sequence give 1 - (0.2 * 0.2) = 0.96, not 1.6.",
  "The page first says cumulative xG applies to a sequence of play whose xG would otherwise total more than 1; its FAQ says it adjusts any sequence with more than one shot. The reference applies the formula to every possession; for a possession with one shot it gives that shot's value.",
  "The page does not say whether penalties count. The reference counts every shot, penalties included.",
  "On the 2022 World Cup final, two Argentina possessions have two shots each (104th and 107th minutes), so cumulative xG is 0.0556 lower than the plain sum.",
]

  [variants.source]
  kind = "web"
  id = "https://support.hudl.com/s/article/cumulative-expected-goals"
  title = "Cumulative Expected Goals (xG)"
  author = "Hudl StatsBomb"
  quote = "From a team perspective, that sequence of play can only ever be worth 1, so there is a simple formula that discounts the values in the sequence, to keep the combined value of these shots under the maximum of 1."
  check = "browser"
  checked = "2026-10-04"
  check_note = "The page builds its text with JavaScript, so match_quote cannot read it; checked word for word in a browser."

  [variants.reference]
  function = "football_metrics.xg:xg_statsbomb_cumulative"
  dataset = "statsbomb-open-data"
  exact = false
  mapping = "Hudl's formula on StatsBomb events, but the grouping is an assumption: a 'sequence of play' is read as the event's possession number in the open data. Hudl's team glossary warns elsewhere that event data and IQ have different possessions, so IQ values can differ. All shots count, penalties included; penalty shoot-out kicks (period 5) are left out."

  [[variants.fixtures]]
  match_id = 3869685
  label = "Argentina v France, World Cup 2022 final"
  team = "Argentina"
  expected = 2.7027

  [[variants.fixtures]]
  match_id = 3869685
  label = "Argentina v France, World Cup 2022 final"
  team = "France"
  expected = 2.2726

[[variants]]
id = "xg.fbref"
name = "FBref (Opta values, possession-capped totals), historical to January 2026"
definition = "Opta's shot xG, totalled per possession as 1 minus the probability that the defending team does not concede in that possession, so one possession is worth at most one goal. Totals include penalty kicks (0.79 each) and leave out penalty shoot-outs. A player's total uses the same rule over his own shots in each possession, so player totals need not add up to the team total."
formula = "sum over possessions of [1 - product over the possession's shots of (1 - Opta xG)]"
zone = "Whole pitch (every shot)."
notes = [
  "FBref's example: shots of .41, .47 and .79 in one Nürnberg possession give 1 - .0657 = .9343 xG, not 1.67.",
  "FBref treats corner kicks and free kicks as the start of a new possession, and said it was still studying the issue.",
  "FBref's column tooltip says xG totals include penalty kicks but not penalty shoot-outs, unless noted otherwise.",
  "Historical: FBref removed its Opta advanced data, xG included, on 20 January 2026 (Sports Reference blog, 'FBref & Stathead Data Update'). Values cited from FBref before then follow this variant.",
  "No reference code: the values come from Opta's model, which is not in the open data.",
]

  [variants.source]
  kind = "web"
  id = "https://web.archive.org/web/20260107000728/https://fbref.com/en/expected-goals-model-explained/"
  title = "xG Explained"
  author = "FBref (Sports Reference)"
  quote = "To solve this problem, we find the probability that the defending team does not allow a goal in this possession."
  check = "normalised"
  checked = "2026-10-04"
  check_note = "FBref blocks automated clients, so the quote is checked against a Wayback Machine snapshot of 7 January 2026."

[[variants]]
id = "xg.opta"
name = "Opta (Stats Perform, The Analyst)"
definition = "Opta's xG model gives each shot the probability that it is scored, from information on similar past shots; totals add those values. The current model is trained with XGBoost on nearly one million shots from 40 competitions between 2018-19 and 2021-22 and evaluates over 20 variables. Penalties get one constant value, 0.79 xG."
formula = "sum of Opta shot xG (penalties = 0.79)"
zone = "Whole pitch (every shot)."
notes = [
  "Opta uses a separate model for women's competitions.",
  "The page does not say how The Analyst totals shots within one possession.",
  "No reference code: the values come from Opta's model, which is not in the open data.",
]

  [variants.source]
  kind = "web"
  id = "https://theanalyst.com/articles/what-is-expected-goals-xg"
  title = "What Are Expected Goals (xG)?"
  author = "Jonny Whitmore (The Analyst)"
  date = "2023-08-08"
  quote = "Penalties are the most consistent shot in football and are given a constant value reflective of their historical conversion rate (0.79 xG)."
  check = "exact"
  checked = "2026-10-04"

[[variants]]
id = "xg.wyscout"
name = "Wyscout"
definition = "Wyscout's machine-learning model gives each shot a probability of scoring from the location of the shot, the location of the assist, foot or head, the assist type, a dribble just before the shot, set piece, counterattack or transition, and the tagger's assessment of danger. A penalty is fixed at 0.76. Totals add shot values with no cap per possession."
formula = "sum of Wyscout shot xG (penalties = 0.76), no possession cap"
zone = "Whole pitch (every shot)."
notes = [
  "So a shot and its rebound can add up to more than 1 xG in one possession.",
  "No reference code: the values come from Wyscout's model, which is not in StatsBomb's open data.",
]

  [variants.source]
  kind = "web"
  id = "https://dataglossary.wyscout.com/xg/"
  title = "xG"
  author = "Wyscout"
  quote = "At the moment there are no additional constraints for xG of shots in the same possession. So a sequence of shots in short succession (like a rebound after a save) could theoretically yield an xG value of > 1."
  check = "exact"
  checked = "2026-10-04"

[[variants]]
id = "xg.understat"
name = "Understat"
definition = "Understat's xG comes from a neural network trained on more than 100,000 shots with over 10 parameters each; the parameters are not listed. A team's match xG is the plain sum of its shot values, penalties included."
formula = "sum of Understat shot xG"
zone = "Whole pitch (every shot)."
notes = [
  "Checked on Understat's public data (4 October 2026): in Liverpool v Manchester City, 8 February 2026 (Understat match 29024), Manchester City's match xG of 2.41476 is the sum of its 16 shot values, a 0.7612 penalty included.",
  "Understat does not publish its penalty value. In Erling Haaland's shot data, penalties carry 0.7612 in the Premier League from 2022/23 and 0.7578 in his Bundesliga seasons 2020/21 and 2021/22.",
  "No reference code: the values come from Understat's model, which is not in the open data.",
]

  [variants.source]
