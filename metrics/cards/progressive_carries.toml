[[variants]]
id = "progressive_carries.fbref-opta"
name = "FBref (Opta data), historical"
definition = "Carries that move the ball towards the opponent's goal line at least 10 yards from its furthest point in the last six passes, or any carry into the penalty area. Carries that end in the defending 50% of the pitch do not count."
formula = "carry ending outside the defending 50%, and (end - furthest point of the ball in the last six passes >= 10 yards towards the goal line, or end in the penalty area)"
zone = "Carries that end outside the carrying team's defending 50% (in the opponent's half)."
counts = "All carries that meet the rule; FBref states no success rule."
notes = [
  "FBref removed its Opta advanced data on 20 January 2026 (Sports Reference blog, 'FBref & Stathead Data Update'), so this variant is historical.",
  "The zone rule differs from FBref's progressive passes, which exclude passes that start in the defending 40%; for carries the end point must be outside the defending 50%.",
  "FBref does not say how the 'furthest point in the last six passes' is found. The reference code states its reading.",
]

  [variants.source]
  kind = "web"
  id = "https://web.archive.org/web/20250504112623/https://fbref.com/en/comps/9/possession/Premier-League-Stats"
  title = "Premier League Possession Stats (archived 4 May 2025)"
  author = "FBref"
  date = "2025-05-04"
  quote = "Carries that move the ball towards the opponent's goal line at least 10 yards from its furthest point in the last six passes, or any carry into the penalty area. Excludes carries which end in the defending 50% of the pitch"
  check = "browser"
  checked = "2026-10-04"
  check_note = "The definition is the column tooltip (the data-tip attribute of the PrgC header), not readable page text, so match_quote cannot read it; checked word for word in the archived page in a browser."

  [variants.reference]
  function = "football_metrics.progression:progressive_carries_fbref"
  dataset = "statsbomb-open-data"
  exact = false
  mapping = "An approximation on StatsBomb events of a definition written for Opta carries: StatsBomb Carry events that end at x >= 60; progressive if carry.end_location is in the penalty area (x >= 102, 18 <= y <= 62) from outside it, or if end x minus the furthest x of the ball is at least 10 (StatsBomb units are yards). The furthest x is read as the largest x among the carry start and the start and end of the team's previous six completed passes in the same StatsBomb possession."

