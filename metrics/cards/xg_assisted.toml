[[variants]]
id = "xg_assisted.asa"
name = "American Soccer Analysis (xAssists, xA)"
definition = "The xG of all the shots for which a player made the pass, using ASA's own xG model."
formula = "sum of ASA xG over the shots whose key pass the player made"
zone = "Whole pitch."
counts = "Key passes, which ASA defines as passes that lead directly to a shot."
notes = [
  "ASA's xG model is a logistic regression with separate models for teams, shooters and goalkeepers.",
