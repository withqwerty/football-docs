name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked pull request
  # is based on the branch below it, so scoping this to main skipped the whole
  # suite on every pull request except the bottom of the stack - #10 merged
  # with CodeQL green and check(20)/check(22) never having run.
  pull_request:

# The job only reads the repository. Without this block it inherits whatever
# the repository default grants, which is write on many settings.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is here because the release workflow runs on it - trusted
        # publishing needs an npm newer than Node 22 ships. A release must not
        # be the first time the suite meets that version.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Rebuild the index first, so the tests read this branch's docs and
      # providers.json rather than whatever data/docs.db was committed with.
      - run: pnpm run ingest
      - run: pnpm test
      - run: pnpm run build
      # The release job attaches this file; a broken script should fail here first.
      - run: pnpm -s site:stats > /dev/null

  # The package runs wherever an MCP client runs, so the suite runs on macOS and
  # Windows too. A separate job keeps the names of the required checks above.
  cross-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run ingest
      - run: pnpm test
      - run: pnpm run build

  # Metric card reference code, checked against each card's test values on
  # StatsBomb open data (downloaded at a pinned commit and SHA-256, cached).
  metric-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/football-docs-metrics
          key: metric-fixtures-${{ hashFiles('metrics/fixtures.json') }}
      - run: pip install pytest==8.4.2
      - run: python scripts/gen_metric_cards.py --check
      - run: python -m pytest -q metrics/tests
