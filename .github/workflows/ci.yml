name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked pull request
  # is based on the branch below it, so scoping this to main skipped the whole
  # suite on every pull request except the bottom of the stack - #10 merged
  # with CodeQL green and check(20)/check(22) never having run.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run ingest
