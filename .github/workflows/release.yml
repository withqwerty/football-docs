name: Release

# A tag is the trigger, because the tag is the thing that was missing. v0.10.0
# was tagged and pushed on 31 August and its GitHub Release was never created,
# so the Releases page showed v0.9.1 as Latest for over a week while npm and the
# tags said otherwise. Tagging and releasing are now one act.
on:
  push:
    tags:
      - 'v*'

# Only the release job writes, and only to this repository's releases. The
# id-token grant is what npm's trusted publishing authenticates against: the
# registry checks the OIDC claim naming this repository and this workflow file,
# so there is no npm token anywhere in this repository.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are read from the second parent of the merge commit the
          # tag points at, which a shallow clone does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, and Node 22 still ships npm
          # 10. Node 24 ships 11.19. The whole job runs on one version because
          # switching mid-job would leave better-sqlite3's native binding built
          # for the wrong ABI, and `pnpm ingest` below would fail on it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Deliberately no dependency cache. npm's own guidance is not to cache
          # in a release build: this is the tree that gets published, so it is
          # resolved fresh from the lockfile rather than rehydrated from a cache
          # that earlier runs could have poisoned.

      - run: pnpm install --frozen-lockfile

      # Fail loudly if a future runner image ships an older npm than trusted
      # publishing needs, rather than falling back to token auth that does not
      # exist here.
      - name: npm must be new enough for trusted publishing
        run: |
          NEED=11.5.1
          GOT="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$GOT" | sort -V | head -1)" != "$NEED" ]; then
            echo "::error::npm ${GOT} is too old for trusted publishing, need >= ${NEED}"
            exit 1
          fi
          echo "npm ${GOT}"

      # A tag that disagrees with package.json publishes one version under
      # another version's name, and nothing downstream would notice. Fail here,
      # before anything is created or published.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v${TAG} does not match package.json ${PKG}"
            exit 1
          fi
          echo "version=${PKG}" >> "$GITHUB_ENV"
          echo "pkg_name=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      # The same gates CI runs. A tag can be pushed to any commit, including one
      # that never went through a pull request, so the release path cannot
      # assume CI already passed on this tree.
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run ingest

      # Release notes are hand-written in the `chore: release vX.Y.Z` commit
      # body, which is richer than anything generated from a commit list. The
      # body is written straight to a file rather than through a step output,
      # so no commit message is ever interpolated into a shell script.
      - name: Assemble release notes
        id: notes
        run: |
          SUBJECT="$(git log -1 --format=%s "${GITHUB_REF_NAME}^{commit}")"

          # A merge commit's own body is pull request boilerplate, so read the
          # release commit it brought in instead.
          case "$SUBJECT" in
            Merge\ pull\ request*) SOURCE="${GITHUB_REF_NAME}^{commit}^2" ;;
            *)                     SOURCE="${GITHUB_REF_NAME}^{commit}" ;;
          esac

          # Trailers are for the commit, not for readers of the release.
          git log -1 --format=%b "$SOURCE" \
            | sed '/^Co-Authored-By:/d; /^Claude-Session:/d' \
            > /tmp/notes.md

          if [ -s /tmp/notes.md ] && grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # --latest is deliberately not passed. GitHub picks the latest release by
      # semver, so backfilling an older tag cannot demote the current one.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          if [ "$GENERATE" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          fi

      # No token. npm's trusted publishing authenticates this workflow to the
      # registry over OIDC, and the trust configuration on the package names
      # this repository and this file - so publishing rights are bound to this
      # workflow rather than to a secret that works from anywhere it leaks to.
      #
      # Provenance is generated automatically under trusted publishing, so
      # --provenance is not passed. Renaming this file, or publishing from
      # another workflow, breaks the trust match by design: re-point it with
      # `npm trust github football-docs --file <new-name> --allow-publish`.
      #
      # Already-published is not a failure. Re-running a release job, or tagging
      # a version someone published by hand, should leave npm as it is.
      - name: Publish to npm
        run: |
          if [ "$(npm view "${pkg_name}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "::notice::${pkg_name}@${version} is already on npm, skipping publish"
            exit 0
          fi
          npm publish
